name: Check Pull Request

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize]
  merge_group:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-pr-label:
    name: Validate the Pull Request's labels
    runs-on: ubuntu-latest
    steps:
      - name: PR must be labeled
        if: github.event_name == 'pull_request'
        uses: js-soft/github-actions/validate-pr-label@3a8b30571a469d885af45763ecc9fcbf571e027a # main

      - name: PR must be labeled
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          QUEUE_REF: ${{ github.ref_name }}
          VALID_LABELS: breaking-change, bug, chore, ci, dependencies, documentation, enhancement, refactoring, test
        run: |
          set -euo pipefail

          trim() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          if [[ ! "$QUEUE_REF" =~ pr-([0-9]+)- ]]; then
            echo "::error::Could not determine the pull request number from merge queue ref '$QUEUE_REF'."
            exit 1
          fi

          pr_number="${BASH_REMATCH[1]}"
          labels="$(gh api "repos/$REPOSITORY/issues/$pr_number" --jq '.labels[].name' | paste -sd, -)"

          if [ -z "$(trim "$labels")" ]; then
            echo "::error::The pull request must have one of these labels: $VALID_LABELS"
            exit 1
          fi

          IFS=',' read -ra valid_labels <<< "$VALID_LABELS"
          IFS=',' read -ra pr_labels <<< "$labels"

          for pr_label in "${pr_labels[@]}"; do
            pr_label="$(trim "$pr_label")"

            for valid_label in "${valid_labels[@]}"; do
              valid_label="$(trim "$valid_label")"

              if [ "$pr_label" = "$valid_label" ]; then
                echo "Pull request #$pr_number label '$pr_label' is accepted."
                exit 0
              fi
            done
          done

          echo "::error::The pull request must have one of these labels: $VALID_LABELS"
          echo "Current labels: $labels"
          exit 1
